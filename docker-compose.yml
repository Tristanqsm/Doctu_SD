services:
  
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - doctu_net

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - /app/node_modules
    networks:
      - doctu_net
    environment:
      - PORT=8080

  servicio-usuarios:
    build: ./usuarios
    volumes:
      - ./usuarios:/app
      - /app/node_modules
      - usuarios_data:/app/database/data
    networks:
      - doctu_net
    environment:
      - PORT=3001
      - JWT_SECRET=doctu_super_secreto_2026

  servicio-agenda:
    build: ./agenda
    volumes:
      - ./agenda:/app
      - /app/node_modules
      - agenda_data:/app/database/data
    networks:
      - doctu_net
    environment:
      - PORT=3002
      - JWT_SECRET=doctu_super_secreto_2026

  servicio-expedientes:
    build: ./expedientes
    volumes:
      - ./expedientes:/app
      - /app/node_modules
      - expedientes_data:/app/database/data
    networks:
      - doctu_net
    environment:
      - PORT=3003
      - JWT_SECRET=doctu_super_secreto_2026
      - AGENDA_SERVICE_URL=http://servicio-agenda:3002

networks:
  doctu_net:
    driver: bridge

volumes:
  usuarios_data:
  agenda_data:
  expedientes_data: