services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - /app/node_modules
    networks:
      - doctu_net
    environment:
      - PORT=8080

  servicio-usuarios:
    build: ./usuarios
    ports:
      - "3001:3001"
    volumes:
      - ./usuarios:/app
      - /app/node_modules
      - doctu_data:/app/database
    networks:
      - doctu_net
    environment:
      - PORT=3001

networks:
  doctu_net:
    driver: bridge

volumes:
  doctu_data: