name: doctu

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - doctu_net

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app
      - /app/node_modules
    networks:
      - doctu_net
    environment:
      - PORT=8080

  servicio-usuarios:
    build: ./usuarios
    volumes:
      - ./usuarios:/app
      - /app/node_modules
      - usuarios_data:/app/database/data
    networks:
      - doctu_net
    environment:
      - PORT=3001
      - JWT_SECRET=doctu_super_secreto_2026

  servicio-agenda:
    build: ./agenda
    volumes:
      - ./agenda:/app
      - /app/node_modules
      - agenda_data:/app/database/data
    networks:
      - doctu_net
    environment:
      - PORT=3002
      - JWT_SECRET=doctu_super_secreto_2026

  # Base de datos exclusiva de expedientes (Database per Service). Es PostgreSQL y no
  # SQLite porque expedientes corre con varias réplicas que deben ver los mismos datos.
  # No publica puerto: solo servicio-expedientes la alcanza por la red interna.
  postgres-expedientes:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=expedientes
      - POSTGRES_USER=expedientes
      - POSTGRES_PASSWORD=expedientes_pass
    volumes:
      - expedientes_pgdata:/var/lib/postgresql/data
    networks:
      - doctu_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expedientes -d expedientes"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicio replicado: 2 copias detrás del balanceador del gateway. Docker Compose
  # registra ambas bajo el mismo nombre en su DNS interno (servicio-expedientes ->
  # 2 IPs). Por eso no lleva container_name ni ports (chocarían entre réplicas).
  # Sin bind mount del código: cada réplica corre exactamente la imagen construida
  # (evita node_modules viejos en volúmenes anónimos al agregar dependencias).
  servicio-expedientes:
    build: ./expedientes
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres-expedientes:
        condition: service_healthy
    networks:
      - doctu_net
    environment:
      - PORT=3003
      - JWT_SECRET=doctu_super_secreto_2026
      - AGENDA_SERVICE_URL=http://servicio-agenda:3002
      - DATABASE_URL=postgres://expedientes:expedientes_pass@postgres-expedientes:5432/expedientes

networks:
  doctu_net:
    driver: bridge

volumes:
  usuarios_data:
  agenda_data:
  expedientes_pgdata: